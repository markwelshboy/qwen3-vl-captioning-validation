[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-vl-captioning-validation"
version = "1.6.0"
description = "Standalone Qwen3-VL dataset analysis/caption comparison harness"
requires-python = ">=3.10"
dependencies = [
  "transformers>=4.57.0,<5",
  "accelerate>=1.0",
  "Pillow>=10",
  "jsonschema>=4.20",
  "tqdm>=4.66"
]

[project.optional-dependencies]
vllm = [
  "vllm",
  "qwen-vl-utils>=0.0.14"
]
bnb = [
  "bitsandbytes>=0.45"
]
# easy-dwpose 1.0.2 incorrectly hard-pins onnxruntime-gpu==1.16.2 on Linux.
# That ORT release has no Python 3.12 wheel and targets the old CUDA 11 stack.
# build_workspace.sh therefore installs easy-dwpose itself with --no-deps after
# installing this compatible runtime set explicitly.
dwpose = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "loguru>=0.7",
  "huggingface-hub>=0.20",
  "matplotlib>=3.8",
  "omegaconf>=2.3",
  "imageio>=2.31",
  "onnxruntime-gpu>=1.21,<1.27; sys_platform == 'linux'",
  "onnxruntime>=1.21,<1.27; sys_platform != 'linux'"
]

[project.scripts]
qwen-vl-validate = "qwen_caption_validate.cli:main"
qwen-dwpose-profile = "qwen_caption_validate.dwpose_compat:main"
qwen-compose-compare = "qwen_caption_validate.compose_compare:main"
qwen-compose-fusion-compare = "qwen_caption_validate.compose_fusion_compare:main"
qwen-dataset-evidence = "qwen_caption_validate.dataset_evidence_v8_1:main"
qwen-fusion-v2 = "qwen_caption_validate.fusion_v2:main"
qwen-fusion-v23 = "qwen_caption_validate.fusion_v2_3:main"
qwen-sam3d-dataset-profile = "qwen_caption_validate.sam3d_dataset_profile:main"

[tool.setuptools]
packages = ["qwen_caption_validate"]
